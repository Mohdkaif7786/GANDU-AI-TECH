<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GUI Calculator</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            background: #f2f2f2; 
        }
        .calc-box {
            width: 300px; 
            margin: 60px auto; 
            padding: 20px;
            background: #fff; 
            border-radius: 8px;
            box-shadow: 0 0 10px #ccc;
        }
        input, select, button { 
            width: 100%; 
            padding: 10px; 
            margin: 6px 0; 
            box-sizing: border-box; 
        }
    </style>
</head>
